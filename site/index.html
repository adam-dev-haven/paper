<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper — market simulator</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📈</text></svg>">
</head>
<body>

<div class="boot" id="boot">
  <div class="boot-mark">Paper</div>
  <div class="boot-sub">Loading market data…</div>
</div>

<header class="topbar" id="topbar" hidden>
  <div class="brand">
    <span class="brand-mark">Paper</span>
    <span class="sim-badge" tabindex="0" title="No real orders are placed and no brokerage is connected. Every position is simulated.">Simulation</span>
  </div>

  <div class="account" id="account"></div>

  <!-- Every figure here is dollars. The line under each one is the same amount in
       whatever currency the profile reads in, and it is a conversion for reading
       rather than a second balance — hence the ≈ and the smaller, dimmer type. -->
  <div class="ticker" id="ticker">
    <div class="ticker-item">
      <span class="ticker-label">Equity</span>
      <span class="ticker-value" id="tk-equity">—</span>
      <span class="ticker-sub" id="tk-equity-sub"></span>
    </div>
    <div class="ticker-item">
      <span class="ticker-label">Total P/L</span>
      <span class="ticker-value" id="tk-pnl">—</span>
      <span class="ticker-sub" id="tk-pnl-sub"></span>
    </div>
    <div class="ticker-item">
      <span class="ticker-label">Cash</span>
      <span class="ticker-value" id="tk-cash">—</span>
      <span class="ticker-sub" id="tk-cash-sub"></span>
    </div>
  </div>

  <div class="topbar-right">
    <div class="regimes" id="regimes"></div>
    <div class="clocks" id="clocks" title="Which exchanges are trading right now."></div>
    <button class="session-badge" id="sessionBadge" data-goto="session" hidden></button>
    <span class="fx-note" id="fxNote" tabindex="0" hidden></span>
    <span class="freshness" id="freshness" tabindex="0" title="Age of the newest quote on the board. Prices come from a free, edge-cached feed, so this ranges from a few seconds to about a minute.">
      <span class="live-dot"></span><span id="freshnessText">—</span>
    </span>
    <button class="icon-btn" id="refresh" title="Refresh prices now">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
      </svg>
    </button>
    <button class="icon-btn" id="settingsBtn" title="Settings — ⌘,">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>
</header>

<nav class="tabs" id="tabs" hidden>
  <button class="tab is-active" data-view="desk">Desk</button>
  <button class="tab" data-view="markets">Markets</button>
  <button class="tab" data-view="analyst">Analyst</button>
  <button class="tab" data-view="session" title="A timed day-trading run on five-minute bars">Session</button>
  <button class="tab" data-view="predict" title="Polymarket's five-minute Bitcoin market, watched and bet automatically">Predict</button>
  <button class="tab" data-view="journal">Journal</button>
  <button class="tab" data-view="learning" title="What has been measured from your record, and what it would change">Calibration</button>
  <button class="tab" data-view="profile">Settings</button>
  <button class="tab" data-view="learn">Guide</button>
  <button class="tab" data-view="diagnostics" title="What the app has been saying to itself — and any ledger or memory that has gone read-only">Diagnostics</button>
  <span class="tab-ink" id="tabInk"></span>
</nav>

<!-- Shown only when a ledger could not be read. A read-only account that looks
     like an empty one is how a data problem gets mistaken for a fresh start. -->
<div id="ledgerAlarm" class="ledger-alarm" hidden></div>
<main id="main" hidden></main>

<div class="settings-scrim" id="settingsScrim" hidden></div>
<aside class="settings-sheet" id="settingsSheet" hidden aria-label="Settings">
  <button class="close-btn settings-close" id="settingsClose" aria-label="Close settings">✕</button>
  <div id="settingsMount"></div>
</aside>

<div class="drawer-scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Instrument detail"></aside>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
